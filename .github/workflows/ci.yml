name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts and tests
        run: python -m compileall scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests
